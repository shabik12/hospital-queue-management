spring.application.name=hospital-queue-management

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_queue_management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect is detected automatically

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.admin.name=System Admin
app.admin.email=admin@hospital.com
app.admin.password=${ADMIN_PASSWORD}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=DEBUG