
name: Spring Boot CI

# When should this workflow execute?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Permissions required by the workflow
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build and execute tests
      - name: Build and Test
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
